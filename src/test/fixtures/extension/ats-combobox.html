<!doctype html>
<!-- Shared combobox shape used by Lever, Ashby, and Workday. -->
<html>
  <body>
    <fieldset>
      <legend>Phone</legend>
      <label for="country">Country*</label>
      <input id="country" role="combobox" aria-autocomplete="list" aria-required="true" value="" />
      <label for="phone">Phone*</label>
      <input id="phone" type="tel" required />
    </fieldset>
    <label for="work_where">Where do you intend to work?*</label>
    <input id="work_where" role="combobox" aria-autocomplete="list" aria-required="true" value="" />
    <button type="submit">Submit application</button>
  </body>
</html>
