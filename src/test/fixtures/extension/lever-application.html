<!doctype html>
<html>
  <body>
    <h1>Frontend Engineer</h1>
    <form>
      <label for="name">Full name</label>
      <input id="name" name="name" required />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />

      <label for="phone">Phone</label>
      <input id="phone" name="phone" />

      <label for="linkedin">LinkedIn</label>
      <input id="linkedin" name="urls[LinkedIn]" />

      <label for="github">GitHub</label>
      <input id="github" name="urls[GitHub]" />

      <label for="portfolio">Portfolio</label>
      <input id="portfolio" name="urls[Portfolio]" />

      <fieldset>
        <legend>Are you a Canadian citizen or authorized to work in Canada?</legend>
        <label><input type="radio" name="auth" value="yes" required /> Yes</label>
        <label><input type="radio" name="auth" value="no" /> No</label>
      </fieldset>

      <label for="comments">Additional information</label>
      <textarea id="comments" name="comments"></textarea>

      <label for="resume">Resume</label>
      <input id="resume" name="resume" type="file" required />

      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
