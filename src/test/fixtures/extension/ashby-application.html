<!doctype html>
<html>
  <body>
    <h1>Product Engineer</h1>
    <form>
      <label for="_systemfield_name">Name</label>
      <input id="_systemfield_name" name="_systemfield_name" required />

      <label for="_systemfield_email">Email</label>
      <input id="_systemfield_email" name="_systemfield_email" type="email" required />

      <label for="_systemfield_phone">Phone</label>
      <input id="_systemfield_phone" name="_systemfield_phone" type="tel" />

      <label for="_systemfield_location">Location</label>
      <input id="_systemfield_location" name="_systemfield_location" required />

      <label for="linkedin">LinkedIn URL</label>
      <input id="linkedin" name="linkedin" type="url" />

      <label for="website">Website</label>
      <input id="website" name="website" type="url" />

      <label for="authorized">Are you legally entitled to work in Canada?</label>
      <select id="authorized" name="authorized" required>
        <option value="">Select</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>

      <label for="sponsor">Do you require visa sponsorship?</label>
      <select id="sponsor" name="sponsor" required>
        <option value="">Select</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>

      <label for="resume">Resume</label>
      <input id="resume" name="resume" type="file" required />

      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
