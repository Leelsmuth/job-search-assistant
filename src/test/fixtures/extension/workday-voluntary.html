<!doctype html>
<html>
  <body>
    <div data-automation-id="progressBar">
      <div data-automation-id="progressBarActiveStep">Voluntary Disclosures</div>
    </div>
    <h2 data-automation-id="applyFlowPageTitle">Voluntary Disclosures</h2>

    <div data-automation-id="formField-gender">
      <label id="gender-label">Gender (voluntary self-identification)</label>
      <div role="radiogroup" aria-labelledby="gender-label">
        <div role="radio" aria-checked="false">Prefer not to say</div>
        <div role="radio" aria-checked="false">Woman</div>
        <div role="radio" aria-checked="false">Man</div>
      </div>
    </div>

    <div data-automation-id="formField-agency">
      <label id="agency-label">Which staffing agency referred you?</label>
      <div role="radiogroup" aria-labelledby="agency-label">
        <div role="radio" aria-checked="false">Agency A</div>
        <div role="radio" aria-checked="false">Agency B</div>
      </div>
    </div>

    <button type="button" data-automation-id="pageFooterNextButton">Submit</button>
  </body>
</html>
