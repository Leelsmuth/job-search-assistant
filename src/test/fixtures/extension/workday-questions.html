<!doctype html>
<html>
  <body>
    <div data-automation-id="progressBar">
      <div data-automation-id="progressBarActiveStep">Application Questions</div>
    </div>
    <h2 data-automation-id="applyFlowPageTitle">Application Questions</h2>

    <div data-automation-id="formField-workAuthorization">
      <label id="auth-label">Are you legally authorized to work in Canada?</label>
      <div role="radiogroup" aria-labelledby="auth-label">
        <div role="radio" aria-checked="false">Yes</div>
        <div role="radio" aria-checked="false">No</div>
      </div>
    </div>

    <div data-automation-id="formField-sponsorship">
      <label id="sponsor-label">Will you now or in the future require sponsorship to work in Canada?</label>
      <div role="radiogroup" aria-labelledby="sponsor-label">
        <div role="radio" aria-checked="false">Yes</div>
        <div role="radio" aria-checked="false">No</div>
      </div>
    </div>

    <div data-automation-id="formField-whyRole">
      <label for="whyRole">Why do you want this role?</label>
      <textarea id="whyRole"></textarea>
    </div>

    <div data-automation-id="formField-color">
      <label id="color-label">What is your favorite color?</label>
      <div role="radiogroup" aria-labelledby="color-label">
        <div role="radio" aria-checked="false">Red</div>
        <div role="radio" aria-checked="false">Blue</div>
      </div>
    </div>

    <div data-automation-id="formField-clearance">
      <label id="clearance-label">Do you hold an active security clearance?</label>
      <div role="radiogroup" aria-labelledby="clearance-label">
        <div role="radio" aria-checked="false">Yes</div>
        <div role="radio" aria-checked="false">No</div>
      </div>
    </div>

    <button type="button" data-automation-id="bottom-navigation-next-button">Save and Continue</button>
  </body>
</html>
