<!doctype html>
<html>
  <body>
    <div data-automation-id="progressBar">
      <div data-automation-id="progressBarActiveStep">My Experience</div>
    </div>
    <h2>My Experience</h2>
    <div data-automation-id="workExperienceSection">
      <div data-automation-id="workExperience-1">
        <label for="jobTitle">Job Title</label>
        <input id="jobTitle" data-automation-id="jobTitle" />
        <label for="company">Company</label>
        <input id="company" data-automation-id="company" />
        <label for="location">Location</label>
        <input id="location" data-automation-id="location" />
        <label for="current">I currently work here</label>
        <input id="current" type="checkbox" data-automation-id="currentlyWorkHere" />
        <div data-automation-id="formField-startDate">
          <label>From</label>
          <input data-automation-id="dateSectionMonth-input" role="spinbutton" aria-label="Month" />
          <input data-automation-id="dateSectionYear-input" role="spinbutton" aria-label="Year" />
        </div>
        <div data-automation-id="formField-endDate">
          <label>To</label>
          <input data-automation-id="dateSectionMonth-input" role="spinbutton" aria-label="Month" />
          <input data-automation-id="dateSectionYear-input" role="spinbutton" aria-label="Year" />
        </div>
        <label for="roleDescription">Role Description</label>
        <textarea id="roleDescription" data-automation-id="roleDescription"></textarea>
      </div>
      <button type="button" data-automation-id="add-button">Add</button>
    </div>
    <button type="button" data-automation-id="bottom-navigation-next-button">Save and Continue</button>
  </body>
</html>
