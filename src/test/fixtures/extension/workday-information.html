<!doctype html>
<html>
  <body>
    <h2>My Information</h2>
    <div data-automation-id="applyFlowPage">
      <label for="legalNameSection_firstName">First Name</label>
      <input id="legalNameSection_firstName" data-automation-id="legalNameSection_firstName" required />

      <label for="legalNameSection_lastName">Last Name</label>
      <input id="legalNameSection_lastName" data-automation-id="legalNameSection_lastName" required />

      <label for="email">Email Address</label>
      <input id="email" name="email" type="email" required />

      <label for="phone">Phone Number</label>
      <input id="phone" name="phone" type="tel" />

      <label for="city">City</label>
      <input id="city" name="city" />

      <label for="region">Province</label>
      <input id="region" name="region" />

      <button type="button" data-automation-id="pageFooterNextButton">Save and Continue</button>
    </div>
  </body>
</html>
